{%extends "base.html" %}

{%block title %} Create To Do List {% endblock title %}

{% block content %}
 <div class="container">

    <form method="post">
        {% csrf_token %}
        
        <div class="mb-3">
            <label for="todoTitle" class="form-label">Title</label>
            <input type="text" name="title"class="form-control" id="todoTitle" name="title" placeholder="Enter title">
        </div>
        
      <div class="form-floating">
  <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea" name="description"></textarea>
  <label for="floatingTextarea">Description</label>
</div>
<br>
<div>
        <button type="submit" class="btn btn-primary">Submit</button> 
    </form>

</div>
{% endblock content %}
